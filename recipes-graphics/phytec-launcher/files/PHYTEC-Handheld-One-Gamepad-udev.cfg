input_driver = "udev"
input_device = "PHYTEC Handheld One Gamepad"
input_device_display_name = "PHYTEC Handheld One Gamepad"
input_vendor_id = "13362"
input_product_id = "1"

# RetroPad uses SNES button names (position-based, not label-based):
#   input_b = bottom (Xbox A), input_a = right (Xbox B)
#   input_y = left (Xbox X),   input_x = top (Xbox Y)
#
# Indices are sequential evdev BTN_* codes from the phyhandheld.c kernel driver.
# Matches Xbox 360 (xpad) button ordering. Verify with: evtest /dev/input/eventX
#
# Evdev sequential index → kernel BTN_* code:
#   0 = BTN_SOUTH (0x130)   4 = BTN_TL (0x136)     8 = BTN_MODE (0x13c)
#   1 = BTN_EAST  (0x131)   5 = BTN_TR (0x137)
#   2 = BTN_NORTH (0x133)   6 = BTN_SELECT (0x13a)
#   3 = BTN_WEST  (0x134)   7 = BTN_START (0x13b)

input_b_btn = "0"
input_a_btn = "1"
input_y_btn = "2"
input_x_btn = "3"
input_l_btn = "4"
input_r_btn = "5"
input_select_btn = "6"
input_start_btn = "7"
input_menu_toggle_btn = "8"

# D-pad: kernel driver uses ABS_HAT0X/ABS_HAT0Y (hat axes, not buttons)
input_up_btn = "h0up"
input_down_btn = "h0down"
input_left_btn = "h0left"
input_right_btn = "h0right"

# Analog sticks and triggers
# Axis indices are sequential ABS_* codes from the kernel driver:
#   0 = ABS_X    (left stick X)     3 = ABS_RX (right stick X)
#   1 = ABS_Y    (left stick Y)     4 = ABS_RY (right stick Y)
#   2 = ABS_Z    (left trigger)     5 = ABS_RZ (right trigger)
input_l_x_plus_axis = "+0"
input_l_x_minus_axis = "-0"
input_l_y_plus_axis = "+1"
input_l_y_minus_axis = "-1"
input_l2_axis = "+2"
input_r_x_plus_axis = "+3"
input_r_x_minus_axis = "-3"
input_r_y_plus_axis = "+4"
input_r_y_minus_axis = "-4"
input_r2_axis = "+5"

input_b_btn_label = "A"
input_a_btn_label = "B"
input_y_btn_label = "X"
input_x_btn_label = "Y"
input_l_btn_label = "LB"
input_r_btn_label = "RB"
