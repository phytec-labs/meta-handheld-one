# RetroPad uses SNES button names:
#   input_b = bottom (Xbox A), input_a = right (Xbox B)
#   input_y = left (Xbox X),   input_x = top (Xbox Y)
# Indices are SDL2 GameController enum values (mapped via SDL_GAMECONTROLLERCONFIG)
